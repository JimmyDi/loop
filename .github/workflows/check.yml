name: Check
on:
  pull_request:
  workflow_call:
    inputs:
      upload_package:
        description: Preserve the verified Linux tarball for the release job
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        name: Prepare Linux sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            # Permit user namespaces only for bwrap on this disposable runner.
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --cap-drop ALL --ro-bind / / \
            --dev /dev --proc /proc -- /bin/sh -c 'exit 0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build
      - if: runner.os != 'Windows'
        run: pnpm test
      # Windows currently covers portable behavior; POSIX PTY and confined Bash need Unix.
      - if: runner.os == 'Windows'
        name: Test Windows portable behavior
        run: >-
          pnpm exec vitest run
          packages/agent/src
          packages/web-ui/src/frontend
          packages/web-ui/src/shared
          packages/web-ui/src/backend/http/static-files.test.ts
          packages/coding-agent/src/cli/args.test.ts
          packages/coding-agent/src/core/sdk.test.ts
          packages/coding-agent/src/core/tools/read.test.ts
          packages/coding-agent/src/core/tools/write.test.ts
          packages/coding-agent/src/core/tools/edit.test.ts
          packages/coding-agent/src/core/sandbox/launcher.test.ts
          scripts/distribution.test.ts
          scripts/release.test.ts
          scripts/check-release.test.ts
      - run: pnpm --config.ignore-scripts=true pack --out loop.tgz
      - run: pnpm verify:package loop.tgz
      - if: inputs.upload_package && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: loop-release-package
          path: loop.tgz
          if-no-files-found: error
          retention-days: 7
