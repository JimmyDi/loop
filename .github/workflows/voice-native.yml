name: Voice release
on:
  push:
    branches:
      - main
    tags:
      - "voice-v*"
    paths:
      - ".github/workflows/voice-native.yml"
      - "packages/coding-agent/src/core/voice/native/**"
      - "!packages/coding-agent/src/core/voice/native/**/*.test.ts"
      - "!packages/coding-agent/src/core/voice/native/**/*.md"
      - "packages/coding-agent/src/core/voice/native/licenses/**"
      - "packages/coding-agent/src/core/voice/resources/catalog.ts"
      - "packages/coding-agent/src/core/voice/resources/download.ts"
      - "packages/coding-agent/src/core/voice/resources/resource-types.ts"
      - "packages/coding-agent/src/core/voice/resources/release-version.ts"
      - "packages/coding-agent/src/core/voice/protocol-*.ts"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag matching the checked-in voice version (manual runs build only)
        required: false
      targets:
        description: Comma-separated native targets to prepare
        required: true
        default: darwin-arm64
permissions:
  contents: read
concurrency:
  group: voice-assets-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        name: Resolve voice resource release version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node --import tsx --input-type=module -e 'import { VOICE_RELEASE_VERSION } from "./packages/coding-agent/src/core/voice/resources/release-version.ts"; console.log(VOICE_RELEASE_VERSION);')
          tag="voice-v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Voice tag must match VOICE_RELEASE_VERSION."
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$tag" ]]; then
            echo "Requested tag must match VOICE_RELEASE_VERSION."
            exit 1
          fi
          [[ "$tag" =~ ^voice-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
            draft=$(printf '%s' "$releases" | jq -r --arg tag "$tag" '[.[][] | select(.tag_name == $tag) | .draft] | if length == 0 then "missing" else .[0] end')
            if [[ "$draft" == "false" ]]; then
              echo "Voice release already published. Bump VOICE_RELEASE_VERSION before publishing changed resources."
              exit 1
            fi
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - id: targets
        env:
          VOICE_RELEASE_TARGETS: ${{ inputs.targets || 'darwin-arm64' }}
        run: node --import tsx packages/coding-agent/src/core/voice/native/prepare-workflow.ts
  build:
    needs: [prepare]
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: pnpm install --frozen-lockfile
      - if: matrix.target == 'darwin-arm64'
        run: node --import tsx packages/coding-agent/src/core/voice/native/build-clean.ts
      - if: matrix.target != 'darwin-arm64'
        run: node --import tsx packages/coding-agent/src/core/voice/native/build.ts
      - run: node --import tsx packages/coding-agent/src/core/voice/native/prepare-engine.ts .tools/voice/build/${{ matrix.target }} .tools/voice/release-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: voice-engine-${{ matrix.target }}
          path: .tools/voice/release-assets/
          if-no-files-found: error
          retention-days: 7
  catalog:
    needs: [prepare, build, models]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: voice-*
          merge-multiple: true
          path: .tools/voice/release-assets
      - env:
          VOICE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VOICE_RELEASE_TARGETS: ${{ needs.prepare.outputs.targets }}
        run: node --import tsx packages/coding-agent/src/core/voice/native/prepare-catalog.ts .tools/voice/release-assets "$VOICE_RELEASE_TAG" --targets "$VOICE_RELEASE_TARGETS"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: voice-complete-release
          path: .tools/voice/release-assets/
          if-no-files-found: error
          retention-days: 7
  models:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx packages/coding-agent/src/core/voice/native/prepare-models.ts .tools/voice/release-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: voice-model-assets
          path: |
            .tools/voice/release-assets/*.tar.gz
            .tools/voice/release-assets/reviewed-model-assets.json
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push'
    needs: [prepare, catalog]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: voice-complete-release
          path: release-assets
      - name: Publish verified voice assets
        env:
          GH_TOKEN: ${{ secrets.VOICE_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VOICE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure the VOICE_RELEASE_TOKEN Actions secret with Contents and Workflows write permissions."
            exit 1
          fi
          cd release-assets
          sha256sum -- *.tar.gz > SHA256SUMS
          title="Loop Voice ${VOICE_RELEASE_TAG#voice-} — Local speech engine & models"
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          draft=$(printf '%s' "$releases" | jq -r --arg tag "$VOICE_RELEASE_TAG" '[.[][] | select(.tag_name == $tag) | .draft] | if length == 0 then "missing" else .[0] end')
          if [[ "$draft" == "false" ]]; then
            echo "Voice release already published; bump VOICE_RELEASE_VERSION."
            exit 1
          elif [[ "$draft" == "true" ]]; then
            target=$(gh release view "$VOICE_RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Draft belongs to another commit; use a new voice version."
              exit 1
            fi
            echo "Resuming the draft for this source commit."
          else
            gh release create "$VOICE_RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$title" --notes "Local voice engine and model bundles. See attached manifests, catalog and SHA256SUMS."
          fi
          gh release upload "$VOICE_RELEASE_TAG" --clobber -- *.tar.gz reviewed-*.json published-catalog.ts SHA256SUMS
          gh release upload "$VOICE_RELEASE_TAG" --clobber -- manifest.json
          gh release edit "$VOICE_RELEASE_TAG" --title "$title" --draft=false --latest=false
