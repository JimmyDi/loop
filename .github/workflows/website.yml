name: Website
on:
  pull_request:
    paths:
      - website/**
      - releases/**
      - scripts/release-content/**
      - scripts/published-release-versions.mjs
      - .github/workflows/website.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: [main]
    paths:
      - website/**
      - releases/**
      - scripts/release-content/**
      - scripts/published-release-versions.mjs
      - .github/workflows/website.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || 'public' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @loop/website
      - run: pnpm --filter @loop/website typecheck
      - name: Confirm published npm versions before generating public content
        run: node scripts/published-release-versions.mjs
      - run: pnpm --filter @loop/website check
      - run: pnpm --filter @loop/website test
      - name: Build portable static assets for GitHub Pages
        run: pnpm --filter @loop/website build --base=./
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy verified website artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
