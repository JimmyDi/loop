<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style data-initial-theme>
      :root { color-scheme: light dark; background: light-dark(#f6f7f9, #18191c); color: light-dark(#71717a, #a4a8b1); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { margin: 0; font-size: 13px; }
      .app-loading { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 100dvh; font-size: 20px; font-weight: 500; }
      .app-loading .loop-icon { width: 48px; height: 48px; flex-shrink: 0; background: url("./assets/loop-icon.png") center / contain no-repeat; }
      :root[data-theme="dark"] .app-loading .loop-icon { background-image: url("./assets/loop-icon-light.png"); }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .app-loading .loop-icon { background-image: url("./assets/loop-icon-light.png"); }
      }
      :root:not([data-pairing]) .remote-bootstrap { display: none; }
      :root[data-pairing] .remote-bootstrap-loading { display: none; }
    </style>
    <script data-initial-theme>
      (() => {
        let theme = "system";
        try {
          const saved = JSON.parse(localStorage.getItem("loop.web.theme"));
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        if (new URLSearchParams(location.hash.slice(1)).get("pair")) {
          document.documentElement.setAttribute("data-pairing", "");
        }
      })();
    </script>
    <title>Loop</title>
    <link rel="icon" type="image/x-icon" href="./assets/loop-icon.ico" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./remote/remote-bootstrap.css" />
  </head>
  <body>
    <div id="root">
      <main class="app-loading remote-bootstrap-loading" role="status">
        <span class="loop-icon" aria-hidden="true"></span>
        <span data-loading>Loading…</span>
      </main>
      <main class="remote-bootstrap">
        <div class="remote-bootstrap-card">
          <h1 data-label="title">Connect to Loop</h1>
          <p data-label="guidance">Scan a new pairing code from Remote access on your computer, then request access.</p>
          <form>
            <label>
              <span data-label="deviceName">Device name</span>
              <input name="name" maxlength="80" required autocomplete="off" />
            </label>
            <button type="submit" data-label="request" disabled>Request access</button>
          </form>
          <div role="status" data-pairing-status hidden>
            <p data-status></p>
            <strong data-code></strong>
            <p data-label="compare" hidden>Confirm that this code matches the code shown on your computer.</p>
          </div>
          <p role="alert" hidden></p>
          <button type="button" data-retry data-label="retry" hidden>Retry</button>
        </div>
      </main>
    </div>
    <script type="module" src="./remote/entry.ts"></script>
  </body>
</html>
