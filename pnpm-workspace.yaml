packages:
  - packages/*
  - website
overrides:
  # Security floors for vulnerable peer/optional resolutions; retain other major versions.
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "zod@>=4.0.0 <4.6.6": 4.6.6
  # Mermaid's 0.16.x range cannot select the patched KaTeX; use the app's tested version.
  "mermaid>katex": 0.18.11
allowBuilds:
  esbuild: true
  sharp: true
  "@google/genai": false
  protobufjs: false
  bufferutil: false
  utf-8-validate: false
